# ============================================================================
# Model registry. Owner: person 3. Read by llm/router.py and llm/manager.py.
#
# THE POINT OF THIS FILE: adding a model must be an edit here plus a weight
# file on disk. No code change, no rebuild, no redeploy. If you find yourself
# editing router.py to teach it about a new model, the registry is wrong --
# fix the registry instead.
#
# Everything is a local path. Nothing in this file may be a URL: the demo
# machine has no route out, and a config that assumes one fails at the worst
# possible moment.
#
# WEIGHT SOURCE (dev machines, today): these paths point at GGUF blobs already
# on disk in Ollama's content-addressed store. We are NOT running Ollama --
# llama-server is launched directly by llm/manager.py (see ADR 0002); Ollama is
# only where the bytes happen to live, and it also ships the llama-server
# binary we use as LLAMA_SERVER_BIN. For the air-gapped demo host these become
# plain files under ./models with checksums in models/MANIFEST.yaml.
# ============================================================================

defaults:
  context: 16384
  n_gpu_layers: 99      # 99 = "all of them"; llama.cpp clamps to what fits
  flash_attn: true
  cache_type_k: q8_0    # q8_0 KV cache roughly halves KV VRAM vs f16, which is
  cache_type_v: q8_0    # the difference between 16k context fitting and not

models:
  # ---------------------------------------------------------------------------
  # Generalist. Handles chat, documents and table/number work. Default because
  # a wrong route TO the generalist is a slow answer; a wrong route AWAY from
  # it is a wrong answer.
  # ---------------------------------------------------------------------------
  - id: qwen2.5-vl-7b
    path: D:/sih/models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    # The projector stays ON in the committed registry. A "LOCAL, UNCOMMITTED"
    # edit that dropped it (and `vision` with it) for a laptop whose desktop
    # apps hold ~1 GB of the card reached main by accident. The model server
    # runs on exactly one host -- the GPU box -- and there the projector fits:
    # 5903 of 6141 MiB measured, vision verified end to end. If another host
    # must load this model without the projector, override there with
    #   MODELS_OVERRIDE_MMPROJ=none   (see llm/manager.py)
    # rather than editing this file: a capability advertised here is a promise
    # the router keeps for everyone who pulls it.
    mmproj: D:/sih/models/mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf
    capabilities: [general, vision, document, data]
    # 16384 fits after all: measured 5903 MiB of 6141 with q8_0 KV and the
    # projector resident, on a GPU with nothing else on it. The earlier 8192
    # was measured while an orphaned Ollama runner held 4653 MiB -- check
    # `nvidia-smi --query-compute-apps` before trusting any VRAM number here.
    context: 16384
    vram_mb: 5903
    default: true

  # ---------------------------------------------------------------------------
  # Code. Deliberately does NOT advertise `general`: routing picks the
  # lowest-VRAM capable model, so a 4B claiming `general` would win every plain
  # question and drag chat quality down with it.
  # ---------------------------------------------------------------------------
  - id: qwen2.5-coder-7b
    path: D:/sih/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
    mmproj: null
    capabilities: [code]
    context: 16384
    vram_mb: 4895
    default: false

  # ---------------------------------------------------------------------------
  # Fast, small, and deliberately NOT routable. `fast` is a capability nothing
  # asks for, so the router can never select this model -- only a user picking
  # it explicitly can.
  #
  # It was added intending to make it the general-chat default, on the theory
  # that a 3B would cut latency. Measured on the same four general prompts,
  # same system prompt, same grammar, same GPU, that was wrong:
  #
  #                        3B        VL-7B
  #   answered directly    2/4        4/4
  #   tool-reached         2/4        0/4
  #   latency         0.6-2.1s   1.5-4.1s
  #   load                4.1s      14.1s
  #   VRAM             2337 MB    5903 MB
  #
  # It is quicker per token but reaches for a tool twice as often, and one
  # needless tool call costs a whole extra round trip -- so as the default it
  # would have been slower end to end and worse. It earns its place as the
  # low-VRAM option in the model picker, not as a default.
  # ---------------------------------------------------------------------------
  - id: qwen2.5-3b
    path: D:/sih/models/qwen2.5-3b-instruct-q4_k_m.gguf
    mmproj: null
    capabilities: [fast]
    context: 16384
    vram_mb: 2337
    default: false

  # ---------------------------------------------------------------------------
  # No separate vision model. qwen2.5-vl-7b above carries `vision`, so the
  # router's image rule still has exactly one model to land on -- with 16384
  # context instead of LLaVA-1.6's 4096, which matters for a scanned report.
  #
  # The retired llava-7b and the two Ollama blobs it shared a store with are
  # NOT interchangeable with these: under grammar-constrained decoding the
  # Ollama qwen2.5-7b blob emits HTML-template junk ('><!-- Template ...')
  # where the official GGUF emits {"final": "391"}. Same llama.cpp binary,
  # same grammar, same prompt. Weights from models/MANIFEST.yaml only.
  # ---------------------------------------------------------------------------

# Router thresholds. Tune against config/router_trainset.jsonl, not by feel.
router:
  min_confidence: 0.60   # below this, stay on the currently loaded model
  switch_penalty: 0.15   # confidence the challenger must beat the incumbent by,
                         # because an 8 s reload has to be worth it
