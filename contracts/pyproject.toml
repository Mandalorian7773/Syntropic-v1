[project]
name = "contracts"
version = "0.1.0"
description = "Shared event, tool and API contracts for the SIH26117 workbench"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*"]
