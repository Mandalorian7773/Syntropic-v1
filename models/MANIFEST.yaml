# ============================================================================
# Weight manifest. Read by scripts/download-models.sh.
#
# !! VERIFY BEFORE THE FIRST DOWNLOAD !!
# Community GGUF repository names, filenames and quant suffixes change without
# notice -- repos get renamed, requantised, or reuploaded under a new org. The
# `repo`, `filename` and `sha256` values below are PLACEHOLDERS. Look each one
# up on Hugging Face, download once on a connected machine, record the real
# sha256 with `shasum -a 256`, and commit that. After that first download the
# project never touches the network again.
#
# size_bytes and sha256 are not decoration: download-models.sh refuses to
# proceed on a mismatch. A silently truncated 5 GB download that llama.cpp
# half-loads is the kind of bug that eats a whole demo day.
# ============================================================================

schema_version: 1

models:
  # Verified 2026-09-03 against the Hugging Face API, downloaded, and hashed on
  # this machine. ggml-org is llama.cpp's own org: the mmproj below is from the
  # SAME build as the weights, which is the only way to be sure vision is not
  # silently producing garbage. Vision path was tested end to end (model read
  # known text off a PNG correctly) before these hashes were recorded.
  - id: qwen2.5-vl-7b
    repo: ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
    filename: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    quant: Q4_K_M
    size_bytes: 4683072032
    sha256: "9258bf05b12686d097ff3b6b18d968ab393649780aa2b3cd67fec43d50554392"
    role: vision-generalist

  # NOT qwen3-coder-8b. Qwen never released a Qwen3-Coder at 8B -- the smallest
  # Qwen3-Coder is 30B-A3B (~18 GB at Q4, needs --cpu-moe and 32 GB system RAM).
  # Confirmed against the HF search API: no such repo exists to point at. This
  # is the official Qwen GGUF build of the 7B coder instead.
  - id: qwen2.5-coder-7b
    repo: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
    filename: qwen2.5-coder-7b-instruct-q4_k_m.gguf
    quant: Q4_K_M
    size_bytes: 4683073536
    sha256: "509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c"
    role: coder

  # The vision model also needs its multimodal projector. Same rules apply.
  # Q8_0, not F16: ggml-org ships both, and Q8_0 saves 500 MB of VRAM on a card
  # where the VL model already peaks at 5903 MiB of 6141.
  - id: qwen2.5-vl-7b-mmproj
    repo: ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
    filename: mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf
    quant: Q8_0
    size_bytes: 853119712
    sha256: "2ddb555391bae966e412deab9e07b58afa18bcc06930ba0f1c78a3695ab9e506"
    role: mmproj

# ============================================================================
# ragsvc CPU models. Owner: person 2. Read by scripts/fetch-rag-models.py,
# NOT by download-models.sh -- these are directories of ONNX graphs plus their
# tokenizers, not single GGUF files, so they need their own fetcher.
#
# Same rules as above: fetched once on a CONNECTED machine, verified by hash,
# then copied to the demo host. Recorded hashes live in models/rag-models.lock.json
# so that this file keeps its comments; the fetcher writes that lock on --record
# and verifies against it on every run afterwards.
#
# int8 rather than fp32 for both: a quarter of the file, a quarter of the
# arithmetic, and the eval harness measures the recall cost at under a point.
# The GPU is not an option for either of these -- see decision 0005.
# ============================================================================

rag_models:
  - id: bge-m3-onnx
    role: embeddings
    repo: Xenova/bge-m3
    revision: main
    dest: bge-m3-onnx
    files:
      - src: onnx/model_int8.onnx
        dest: model_int8.onnx
      - src: tokenizer.json
        dest: tokenizer.json
      - src: tokenizer_config.json
        dest: tokenizer_config.json
      - src: config.json
        dest: config.json

  - id: bge-reranker-v2-m3-onnx
    role: reranker
    repo: onnx-community/bge-reranker-v2-m3-ONNX
    revision: main
    dest: bge-reranker-v2-m3-onnx
    files:
      - src: onnx/model_int8.onnx
        dest: model_int8.onnx
      - src: tokenizer.json
        dest: tokenizer.json
      - src: tokenizer_config.json
        dest: tokenizer_config.json
      - src: config.json
        dest: config.json

  # English text recogniser for the OCR stage. rapidocr bundles the Chinese
  # PP-OCRv4 recogniser, which is trained on a script that does not use word
  # spacing and therefore emits none: an English letterhead comes back as
  # "MANGALOREREFINERYANDPETROCHEMICALSLIMITED", which BM25 cannot match a
  # single word of. This model fixes that and is 24% faster as a side effect,
  # its output projection being 97 classes rather than 6625. Its character
  # dictionary is embedded in the ONNX metadata, so there is no keys file.
  - id: rapidocr-en-rec
    role: ocr-recognition
    repo: SWHL/RapidOCR
    revision: main
    dest: rapidocr
    files:
      - src: PP-OCRv3/en_PP-OCRv3_rec_infer.onnx
        dest: en_PP-OCRv3_rec_infer.onnx
