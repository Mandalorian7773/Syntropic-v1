[project]
name = "backend"
version = "0.1.0"
description = "Gateway, model manager, agent loop, tools and sandbox. Owner: person 3."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "joblib>=1.4",
  "docker>=7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "llm", "tools", "audit", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
