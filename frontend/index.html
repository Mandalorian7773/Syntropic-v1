<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No remote fonts, no CDN links. Anything this page loads is vendored. -->
    <title>Privis</title>
    <!-- Apply the saved theme before first paint (see src/store/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem('privis-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
